<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Agentic AI Journey - 26 Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>

<body class="bg-slate-950 text-slate-100 h-screen flex overflow-hidden">

    <!-- Mobile Sidebar Overlay -->

    <!-- Sidebar -->

        class="fixed lg:static inset-y-0 left-0 z-30 w-80 bg-slate-900 border-r border-slate-800 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
        <!-- Sidebar Header -->
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div
                    class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                    AI
                </div>
                <h1 class="font-bold text-base tracking-tight text-white">Agentic AI Journey</h1>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white p-1 rounded-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Search Bar -->
        <div class="p-3 border-b border-slate-800">
            <div class="relative">
                <input type="text" id="searchInput" oninput="filterProjects()" placeholder="Search projects..."
                    class="w-full bg-slate-800/90 text-sm text-slate-100 rounded-lg pl-9 pr-3 py-2 border border-slate-700 focus:outline-none focus:border-indigo-500 transition" />
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
        </div>

        <!-- Project List (1 to 26) -->
        <div id="projectList" class="flex-1 overflow-y-auto p-2 space-y-1">
            <!-- Dynamically populated via JS -->
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col w-full h-full overflow-hidden">

        <!-- Top Navigation Bar -->
        <header
            class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0 z-10">
            <div class="flex items-center space-x-3">
                <button onclick="toggleSidebar()"
                    class="lg:hidden p-2 rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <span id="topBarTitle"
                    class="text-sm font-medium text-slate-300 truncate max-w-[200px] sm:max-w-md md:max-w-xl">
                    1. Expense and Invoice Tracker
                </span>
            </div>

            <!-- Top Prev / Next Buttons -->
            <div class="flex items-center space-x-2">
                <button id="topPrevBtn" onclick="prevProject()"
                    class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:pointer-events-none text-xs sm:text-sm font-medium transition flex items-center space-x-1 border border-slate-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    <span>Prev</span>
                </button>
                <button id="topNextBtn" onclick="nextProject()"
                    class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:pointer-events-none text-xs sm:text-sm font-medium text-white transition flex items-center space-x-1 shadow-md shadow-indigo-600/20">
                    <span>Next</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Scrollable Project Details -->
        <main id="mainContent" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <div class="max-w-4xl mx-auto space-y-6 pb-12">

                <!-- Project Title Card -->
                <div
                    class="bg-gradient-to-br from-slate-900 to-slate-800/80 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl">
                    <div class="text-xs font-semibold uppercase tracking-wider text-indigo-400 mb-2">Project Title</div>
                    <h2 id="projTitle" class="text-2xl sm:text-3xl font-bold text-white tracking-tight"></h2>
                </div>

                <!-- Project Description -->
                <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-lg">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-indigo-400 mb-2">Project Description
                    </h3>
                    <p id="projDesc" class="text-slate-200 leading-relaxed text-base sm:text-lg"></p>
                </div>

                <!-- Problem & Solution Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Explain about the problem statement -->
                    <div class="bg-slate-900/90 border border-red-900/40 rounded-2xl p-6 shadow-lg flex flex-col">
                        <div class="flex items-center space-x-2 mb-3">
                            <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                            <h3 class="text-xs font-semibold uppercase tracking-wider text-red-400">Explain about the
                                problem statement</h3>
                        </div>
                        <p id="projProblem" class="text-slate-300 leading-relaxed flex-1"></p>
                    </div>

                    <!-- how this will solve that problem statement -->
                    <div class="bg-slate-900/90 border border-emerald-900/40 rounded-2xl p-6 shadow-lg flex flex-col">
                        <div class="flex items-center space-x-2 mb-3">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                            <h3 class="text-xs font-semibold uppercase tracking-wider text-emerald-400">How this will
                                solve that problem statement</h3>
                        </div>
                        <p id="projSolution" class="text-slate-300 leading-relaxed flex-1"></p>
                    </div>
                </div>

                <!-- Project Architecture -->
                <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-lg">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-amber-400 mb-3">Project Architecture
                    </h3>
                    <p id="projArch" class="text-slate-200 leading-relaxed"></p>
                </div>

                <!-- Project Architecture Diagram -->
                <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-lg">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-cyan-400 mb-5">Project Architecture
                        Diagram</h3>
                    <div id="projDiagram"
                        class="flex flex-wrap items-center justify-center gap-3 py-4 px-2 bg-slate-950/70 rounded-xl border border-slate-800/80">
                        <!-- Dynamically populated nodes -->
                    </div>
                </div>

                <!-- Conclusion -->
                <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-lg">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-purple-400 mb-2">Conclusion</h3>
                    <p id="projConclusion" class="text-slate-200 leading-relaxed"></p>
                </div>

                <!-- Topics Covered -->
                <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-lg">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-pink-400 mb-4">Topics Covered</h3>
                    <div id="projTopics" class="flex flex-wrap gap-2">
                        <!-- Dynamically populated badges -->
                    </div>
                </div>

                <!-- Bottom Prev / Next Navigation Bar -->
                <div class="pt-4 border-t border-slate-800 flex items-center justify-between gap-4">
                    <button id="bottomPrevBtn" onclick="prevProject()"
                        class="flex-1 sm:flex-initial px-5 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 disabled:opacity-40 disabled:pointer-events-none text-slate-200 font-medium transition flex items-center justify-center space-x-2 border border-slate-800">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                        <span>Previous Project</span>
                    </button>

                    <button id="bottomNextBtn" onclick="nextProject()"
                        class="flex-1 sm:flex-initial px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:pointer-events-none text-white font-medium transition flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/30">
                        <span>Next Project</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>

            </div>
        </main>
    </div>

    <script>
        const projects = [
            {
                id: 1,
                title: "Expense and Invoice Tracker",
                description: "A simple web application that replaces a freelancer's messy paper notebooks and Excel sheets with a clean dashboard showing monthly money summaries and unpaid invoices.",
                problem: "Freelancers usually write down their income and daily expenses in notebooks or random spreadsheets. When the month ends, they waste hours calculating how much profit they made and figuring out which clients still haven't paid them.",
                solution: "You will build a web service where the freelancer simply types in their expenses and client bills. The backend automatically calculates monthly profit totals and highlights unpaid invoices in one click.",
                architecture: "The user enters data on a Web Browser (HTML/CSS/JS), which sends requests to a Python Backend (FastAPI or Flask). The backend calculates totals and stores all records safely inside a SQLite or PostgreSQL Database.",
                diagram: ["Freelancer Browser UI", "Python Backend (FastAPI)", "SQLite Database", "Monthly Summary & Unpaid List"],
                conclusion: "This project builds a complete, working web application from scratch. It gives you strong confidence in Python syntax, backend logic, and database storage before moving into AI.",
                topics: ["Python Basics", "FastAPI / Flask", "SQLite Database", "CRUD Operations", "REST APIs"]
            },
            {
                id: 2,
                title: "Bank Statement Reconciliation Tool",
                description: "An automated Python tool that compares a company's bank statement against their internal accounting ledger and flags duplicate entries or mismatched amounts.",
                problem: "Accountants spend days manually comparing two massive Excel files line-by-line to verify if every bank transaction matches the company's internal records. Human eyes get tired, causing costly mistakes.",
                solution: "You will write a Python script that reads both files simultaneously, matches transactions by date, amount, and reference ID, and immediately generates a clean report listing missing payments, duplicates, and odd numbers.",
                architecture: "Two CSV/Excel files (Bank Statement and Internal Ledger) are uploaded into a Python Pandas processing script. The matching engine applies reconciliation rules and exports a highlighted Excel discrepancy report.",
                diagram: ["Bank CSV + Ledger CSV", "Python Pandas Engine", "Duplicate & Mismatch Matcher", "Discrepancy Report File"],
                conclusion: "You learn how to clean, compare, and manipulate messy real-world financial files using Python—a must-have skill before preparing data for Machine Learning models.",
                topics: ["Python File I/O", "Pandas Library", "Data Cleaning", "Rule-Based Matching", "Automated Reporting"]
            },
            {
                id: 3,
                title: "Complaint Classifier for an E-commerce Team",
                description: "A machine learning tool that reads thousands of customer complaints and automatically tags them into categories like 'Late Delivery', 'Damaged Item', or 'Refund Request'.",
                problem: "An online shopping company receives thousands of angry customer messages every single day. Support agents have to read each message manually just to label what the issue is, slowing down response times.",
                solution: "You will train an NLP classifier that turns customer text into numbers using five different techniques, compares their accuracy, and uses the best one to tag incoming complaints automatically in milliseconds.",
                architecture: "Raw customer text goes through a Text Cleaning step (removing stopwords and punctuation), then passes through 5 Vectorization methods (Bag of Words, TF-IDF, Word2Vec, etc.), and feeds into a Scikit-Learn Classifier to output the tag.",
                diagram: ["Raw Complaint Text", "Text Preprocessing", "5 Vectorizers (BoW, TF-IDF, etc.)", "ML Classifier", "Category Tag"],
                conclusion: "This is your first core NLP project. You will clearly understand how computers convert human words into mathematical numbers and make predictions.",
                topics: ["Tokenization & Lemmatization", "Bag of Words (BoW)", "TF-IDF", "Word Embeddings", "Scikit-Learn Classification"]
            },
            {
                id: 4,
                title: "Complaint Triage Service",
                description: "A backend API service that accepts bulk complaint files, groups duplicate complaints about the same outage or issue together, and routes each group to the right department.",
                problem: "When a big problem happens (like a payment gateway crashing), 500 customers send the exact same complaint. Even with auto-tagging, teams get flooded with 500 separate tickets instead of one grouped alert.",
                solution: "You will build a smart API that calculates text similarity to cluster duplicate complaints into a single master ticket and automatically sends it to the right department's queue (Tech, Finance, or Logistics).",
                architecture: "Incoming complaint files hit a FastAPI endpoint, pass through a Text Similarity & Clustering module to group duplicates, and a Routing Engine dispatches the grouped payload to the respective team webhook.",
                diagram: ["Complaint Batch File", "FastAPI Endpoint", "Cosine Similarity Grouping", "Department Router", "Team Queues"],
                conclusion: "You learn how to wrap your NLP logic inside a real production API that groups similar text and automates workplace workflows.",
                topics: ["REST API Design", "Cosine Similarity", "Text Clustering", "Duplicate Detection", "Automated Routing"]
            },
            {
                id: 5,
                title: "Hotel Review Rating Predictor",
                description: "A deep learning benchmark system that reads a guest's written hotel review and predicts the star rating (1 to 5 stars) while comparing ML, ANN, RNN, LSTM, and GRU models.",
                problem: "Sometimes users write detailed reviews on travel sites without clicking a star rating, or leave a 5-star click by mistake while writing a terrible review. Simple keyword counters fail to understand sentence flow like 'The room was not bad at all'.",
                solution: "You will build and train five different models—from traditional Machine Learning to sequence-aware Deep Learning models (RNN, LSTM, GRU)—so you can see firsthand how memory networks capture word order and context.",
                architecture: "Review text is tokenized and padded into fixed-length sequences, passed through an Embedding Layer, trained across 5 architectures (ML, ANN, RNN, LSTM, GRU), evaluated on test metrics, and outputs a 1–5 star prediction.",
                diagram: ["Hotel Review Text", "Tokenizer & Padding", "ML vs ANN vs RNN vs LSTM vs GRU", "Accuracy Comparison", "1-5 Star Prediction"],
                conclusion: "By comparing five model types side-by-side on the exact same dataset, you gain practical clarity on why sequence models like LSTM and GRU beat simple networks on text.",
                topics: ["Artificial Neural Networks (ANN)", "Recurrent Neural Networks (RNN)", "LSTM & GRU", "Sequence Padding", "Model Benchmarking"]
            },
            {
                id: 6,
                title: "Urgent Ticket Detector",
                description: "A real-time deep learning classifier using an LSTM or GRU network that scans incoming support tickets and pushes critical emergencies straight to the top of the queue.",
                problem: "Support teams usually answer tickets on a 'first-come, first-served' basis. A customer whose entire server is down waits hours behind 200 people asking how to change their profile picture.",
                solution: "You will train an LSTM/GRU model on historical support tickets to detect urgency signals and emotional distress in full sentences, automatically flagging critical tickets as 'High Priority' the second they arrive.",
                architecture: "New ticket text enters the preprocessing pipeline, converts into word index sequences, runs through a trained Bidirectional LSTM/GRU network, and triggers a Priority Alert if the urgency probability crosses the threshold.",
                diagram: ["Incoming Ticket", "Sequence Tokenizer", "Trained LSTM / GRU Model", "Urgency Score > Threshold", "Priority Queue Alert"],
                conclusion: "You see how sequence deep learning models directly solve high-stakes business problems by preventing critical customer emergencies from sitting unnoticed.",
                topics: ["Bidirectional LSTM / GRU", "Binary Classification", "Class Imbalance Handling", "Precision & Recall", "Real-Time Inference"]
            },
            {
                id: 7,
                title: "Meeting Notes Assistant",
                description: "An AI productivity tool powered by Transformer models that takes a long meeting transcript, writes a short summary, extracts action items, and translates them into another language.",
                problem: "After a 1-hour team call, nobody wants to read a 15-page raw transcript to figure out what was decided or who needs to do what, especially in global teams working across multiple languages.",
                solution: "You will use pre-trained Hugging Face Transformer pipelines to automatically condense the meeting into bullet points, pull out tasks with owner names, and translate the final notes for international teammates.",
                architecture: "Raw meeting transcript text is chunked and fed into three specialized Transformer pipelines (Summarization, Action-Item Extraction, and Neural Machine Translation) and rendered on a clean UI.",
                diagram: ["Raw Meeting Transcript", "Text Chunker", "Summarizer Transformer", "Action Item Extractor", "Multi-Language Translator"],
                conclusion: "You experience the massive leap from RNNs to Transformers, seeing how Attention mechanisms handle summarization and translation with ease.",
                topics: ["Transformer Architecture", "Self-Attention Mechanism", "Hugging Face Pipelines", "Text Summarization", "Machine Translation"]
            },
            {
                id: 8,
                title: "Should We Upgrade the Ticket Model?",
                description: "An engineering evaluation project where you fine-tune a modern Transformer model on the urgent ticket dataset, compare it against your Phase 3 LSTM model, and write an executive recommendation memo.",
                problem: "In the real world, managers won't let you upgrade to a heavier, more expensive AI model just because it's trendy. They need hard proof showing whether the accuracy boost justifies the slower speed and higher server cost.",
                solution: "You will fine-tune a Transformer (like DistilBERT) on the same urgent ticket data, measure F1-score, inference latency (ms), and GPU/CPU memory cost against your old LSTM, and write a clear engineering decision memo.",
                architecture: "The Urgent Ticket Dataset is evaluated on both the Legacy LSTM Model and a Fine-Tuned DistilBERT Transformer. A Benchmark Runner records Accuracy, Latency, and RAM usage to produce a Cost-Benefit Decision Memo.",
                diagram: ["Ticket Dataset", "LSTM vs Fine-Tuned Transformer", "Accuracy & Latency Benchmark", "Cost Calculator", "Executive Decision Memo"],
                conclusion: "This teaches you to think like a Senior AI Engineer—balancing model accuracy against real-world latency and cloud hardware costs.",
                topics: ["Transformer Fine-Tuning", "DistilBERT / BERT", "Latency vs Accuracy Tradeoffs", "Hardware Cost Analysis", "Technical Memo Writing"]
            },
            {
                id: 9,
                title: "HR Leave Helpdesk Assistant",
                description: "A reliable LLM assistant that answers employee leave questions using structured JSON outputs, calls a live calendar/balance function, retries failed calls, and falls back to a local Ollama model if the cloud API goes down.",
                problem: "HR teams answer the same questions all day ('How many sick leaves do I have left?'). Basic chatbots fail in production because they return unstructured essays or crash completely when OpenAI/cloud APIs have an outage.",
                solution: "You will build a resilient assistant that forces the LLM to reply in strict JSON format, uses Function Calling to check an employee's live leave balance, automatically retries on network glitches, and switches to a local Ollama model if the cloud fails.",
                architecture: "Employee query -> Primary Cloud LLM with Function Calling (Leave DB lookup) + Pydantic JSON Validator -> Automatic Retry Handler -> Local Ollama Fallback Model -> Verified Structured Response.",
                diagram: ["Employee Query", "Cloud LLM + Function Calling", "Retry & JSON Validator", "Local Ollama Fallback", "Verified HR Response"],
                conclusion: "You master the core building blocks of production LLM engineering: structured outputs, tool calling, automatic retries, and zero-downtime local fallbacks.",
                topics: ["Prompt Engineering", "Structured JSON (Pydantic)", "LLM Function Calling", "Retry Logic & Exponential Backoff", "Local LLMs with Ollama"]
            },
            {
                id: 10,
                title: "Invoice and Email Data Extractor",
                description: "A document extraction benchmark that pulls structured invoice fields (vendor, date, total, tax) from messy emails and PDFs using a Hugging Face model, a Cloud LLM API, and a local LLM, then compares all three.",
                problem: "Companies receive thousands of invoices buried inside messy email bodies and differently formatted PDFs. Typing vendor names, dates, and tax amounts into accounting software by hand is slow and error-prone.",
                solution: "You will build an extraction pipeline that runs the exact same messy invoices through three engines—a Hugging Face extraction model, a commercial LLM API, and a local open-source model—and compares their accuracy, speed, and privacy.",
                architecture: "Messy Invoices/Emails -> Document Parser -> Parallel Extraction across (1) Hugging Face Model, (2) Cloud LLM API, and (3) Local Ollama Model -> JSON Schema Validator -> Comparison Report.",
                diagram: ["Messy Emails & PDFs", "Text Parser", "HF Model vs Cloud LLM vs Local LLM", "JSON Field Validator", "Accuracy & Cost Comparison"],
                conclusion: "You learn how to turn unstructured messy documents into clean database rows and know exactly when to pick a cloud API versus a free local model.",
                topics: ["Unstructured Data Extraction", "Zero-Shot & Few-Shot Prompting", "Hugging Face vs Cloud API vs Local", "Schema Validation", "Cost & Privacy Evaluation"]
            },
            {
                id: 11,
                title: "IT Helpdesk Ticket Router",
                description: "An automated LangChain workflow that reads incoming IT support emails, auto-replies to simple issues, asks the user for missing details when an email is vague, or escalates to a human engineer—all tracked in LangSmith.",
                problem: "Most IT tickets say things like 'My laptop is not working' without giving an error code or screenshot. IT staff waste days playing email ping-pong just to collect basic details before they can even start fixing the problem.",
                solution: "You will build a conditional LangChain pipeline that classifies the email: if it's a known password reset, it auto-replies; if details are missing, it automatically emails back asking for the error screenshot; if it's severe, it escalates—while logging every step in LangSmith.",
                architecture: "Incoming IT Email -> LangChain Classifier Chain -> Conditional Router (Branch 1: Auto-Reply | Branch 2: Request Missing Info | Branch 3: Human Escalation) -> Full Traceability in LangSmith.",
                diagram: ["Incoming IT Email", "LangChain Router Chain", "Auto-Reply / Ask Info / Escalate", "LangSmith Trace Logger"],
                conclusion: "You learn how to build multi-step conditional workflows in LangChain and debug every prompt and token in real time using LangSmith.",
                topics: ["LangChain Expression Language (LCEL)", "Conditional Routing", "Multi-Step Chains", "LangSmith Tracing & Debugging", "Automated Triage"]
            },
            {
                id: 12,
                title: "Product Description Generator Lab",
                description: "An experimentation lab for an online store that tests three different prompt styles and LLM models to generate SEO-friendly product descriptions, picking the winner based on quality, cost, and speed.",
                problem: "E-commerce stores add hundreds of new products every week. Writing catchy descriptions manually takes too long, but picking a single AI prompt and model blindly can result in robotic writing or massive API bills.",
                solution: "You will create a testing lab that takes product specs (name, features, target audience) and runs three prompt-and-model combinations side-by-side, scoring each output on accuracy, token cost, and generation speed.",
                architecture: "Product Specs Input -> LangChain Experiment Runner -> 3 Prompt + Model Variants -> LLM-as-a-Judge & Metric Evaluator (Quality, Cost, Latency) -> Winner Selection Dashboard.",
                diagram: ["Product Attributes", "3 Prompt & Model Variants", "Parallel Generation", "Quality, Cost & Speed Evaluator", "Winning Prompt & Model"],
                conclusion: "Instead of guessing which prompt or model is best, you learn how to run scientific A/B experiments to pick the fastest, cheapest, and highest-quality setup.",
                topics: ["Prompt Versioning", "Model Comparison", "LLM-as-a-Judge Evaluation", "Token Cost Tracking", "Latency Benchmarking"]
            },
            {
                id: 13,
                title: "Company Policy Q&A Bot",
                description: "A Retrieval-Augmented Generation (RAG) chatbot that reads 200-page company policy PDFs, answers employee questions with exact page citations, and strictly says 'I do not know' when the answer isn't in the document.",
                problem: "Nobody reads 200-page company rulebooks. However, if you ask a normal LLM about your company's specific reimbursement rules, it will hallucinate (make up fake policies) because it doesn't know your private documents.",
                solution: "You will build a RAG pipeline that splits the PDFs into chunks, stores them in a Vector Database, retrieves the exact matching paragraphs when a question is asked, cites the page numbers, and refuses to guess if the info is missing.",
                architecture: "200-Page PDFs -> Text Splitter -> Embedding Model -> Vector Database -> User Query -> Top-K Retriever -> Grounded Prompt with Citation Rules -> Answer + Page Numbers (or 'I do not know').",
                diagram: ["200-Page Policy PDFs", "Chunking & Embeddings", "Vector Database", "Relevant Chunk Retriever", "Answer with Page Citations"],
                conclusion: "RAG is the #1 most requested skill in enterprise GenAI jobs today. You learn how to connect LLMs to private company data while stopping hallucinations.",
                topics: ["Retrieval-Augmented Generation (RAG)", "PDF Chunking Strategies", "Vector Databases (FAISS/Chroma)", "Grounded Generation", "Hallucination Prevention"]
            },
            {
                id: 14,
                title: "Self-Correcting Support Bot with Citations",
                description: "An advanced Corrective RAG (CRAG) bot that grades its own retrieved document chunks, automatically rewrites the search query and retries if the chunks are weak, and creates a human support ticket if it still can't find a solid answer.",

        let currentIndex = 0;

        function renderSidebar(filterText = "") {
            const listEl = document.getElementById("projectList");
            listEl.innerHTML = "";

            const query = filterText.toLowerCase().trim();

            projects.forEach((proj, idx) => {
                const match =
                    proj.title.toLowerCase().includes(query) ||
                    proj.id.toString() === query ||
                    proj.topics.some(t => t.toLowerCase().includes(query));

                if (!match) return;

                const isActive = idx === currentIndex;
                const btn = document.createElement("button");
                btn.onclick = () => selectProject(idx);
                btn.className = `w-full text-left px-3 py-2.5 rounded-xl transition flex items-center space-x-3 ${isActive
                        ? "bg-indigo-600 text-white font-semibold shadow-md shadow-indigo-600/20"
                        : "text-slate-300 hover:bg-slate-800/80 hover:text-white"
                    }`;

                btn.innerHTML = `
          <span class="w-7 h-7 shrink-0 rounded-lg flex items-center justify-center text-xs font-bold ${isActive ? "bg-indigo-800 text-white" : "bg-slate-800 text-slate-400"
                    }">
            ${proj.id}
          </span>
          <span class="text-sm truncate">${proj.title}</span>
        `;
                listEl.appendChild(btn);
            });
        }

        function renderProject() {
            const proj = projects[currentIndex];

            // Update top bar & main titles
            document.getElementById("topBarTitle").textContent = `${proj.id}. ${proj.title}`;
            document.getElementById("projTitle").textContent = `${proj.id}. ${proj.title}`;
            document.getElementById("projDesc").textContent = proj.description;
            document.getElementById("projProblem").textContent = proj.problem;
            document.getElementById("projSolution").textContent = proj.solution;
            document.getElementById("projArch").textContent = proj.architecture;
            document.getElementById("projConclusion").textContent = proj.conclusion;

            // Render Architecture Diagram
            const diagEl = document.getElementById("projDiagram");
            diagEl.innerHTML = "";
            proj.diagram.forEach((step, i) => {
                const node = document.createElement("div");
                node.className = "px-4 py-2.5 rounded-xl bg-slate-900 border border-cyan-500/30 text-cyan-300 text-xs sm:text-sm font-medium shadow-md text-center";
                node.textContent = step;
                diagEl.appendChild(node);

                if (i < proj.diagram.length - 1) {
                    const arrow = document.createElement("div");
                    arrow.className = "text-slate-500 font-bold text-lg px-1";
                    arrow.innerHTML = "&#8594;";
                    diagEl.appendChild(arrow);
                }
            });

            // Render Topics Covered
            const topicsEl = document.getElementById("projTopics");
            topicsEl.innerHTML = "";
            proj.topics.forEach(topic => {
                const badge = document.createElement("span");
                badge.className = "px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-200 text-xs sm:text-sm font-medium";
                badge.textContent = topic;
                topicsEl.appendChild(badge);
            });

            // Update Prev/Next button states
            const isFirst = currentIndex === 0;
            const isLast = currentIndex === projects.length - 1;

            document.getElementById("topPrevBtn").disabled = isFirst;
            document.getElementById("bottomPrevBtn").disabled = isFirst;
            document.getElementById("topNextBtn").disabled = isLast;
            document.getElementById("bottomNextBtn").disabled = isLast;

            // Re-render sidebar active state
            renderSidebar(document.getElementById("searchInput").value);

            // Scroll main content back to top
            document.getElementById("mainContent").scrollTop = 0;
        }

        function selectProject(index) {
            currentIndex = index;
            renderProject();
            // Close drawer automatically on mobile/tablet after selecting a project
            if (window.innerWidth < 1024) {
                closeSidebar();
            }
        }

        function prevProject() {
            if (currentIndex > 0) {
                currentIndex--;
                renderProject();
            }
        }

        function nextProject() {
            if (currentIndex < projects.length - 1) {
                currentIndex++;
                renderProject();
            }
        }

        function filterProjects() {
            const val = document.getElementById("searchInput").value;
            renderSidebar(val);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("sidebarOverlay");
            const isClosed = sidebar.classList.contains("-translate-x-full");
            if (isClosed) {
                sidebar.classList.remove("-translate-x-full");
                overlay.classList.remove("hidden");
            } else {
                closeSidebar();
            }
        }

        function closeSidebar() {
            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("sidebarOverlay");
            sidebar.classList.add("-translate-x-full");
            overlay.classList.add("hidden");
        }

        // Keyboard navigation support (Left / Right arrows)
        window.addEventListener("keydown", (e) => {
            if (document.activeElement.tagName === "INPUT") return;
            if (e.key === "ArrowLeft") prevProject();
            if (e.key === "ArrowRight") nextProject();
        });

        // Initial render
        renderProject();
    </script>
